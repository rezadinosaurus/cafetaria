name: rebuild fresh defconfig

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/android_kernel_qcom_sm8250' }
      branch: { description: 'Branch', required: true, default: 'lineage-mocca' }

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}

    - name: Setup Toolchain
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc python3 wget xz-utils

        mkdir -p tc/gcc
        wget -q "https://github.com/mvaisakh/gcc-build/releases/download/01102026/eva-gcc-arm64-01102026.xz" -O tc/gcc.tar.xz
        tar -xf tc/gcc.tar.xz -C tc/gcc --strip-components=1
        echo "$PWD/tc/gcc/bin" >> $GITHUB_PATH

        GCC_PREFIX=$(find $PWD/tc/gcc/bin -name '*-gcc' | head -n1 | sed 's/.*\///;s/gcc$//')
        echo "GCC_PREFIX=$GCC_PREFIX" >> $GITHUB_ENV

    - name: Rebuild Defconfig
      run: |
        set -eo pipefail

        make O=out ARCH=arm64 CROSS_COMPILE=${GCC_PREFIX} vendor/alioth_defconfig

        mkdir -p defconfig_output
        cp out/.config defconfig_output/alioth_defconfig

        echo "Old: $(wc -l < arch/arm64/configs/vendor/alioth_defconfig) lines" >> $GITHUB_STEP_SUMMARY
        echo "New: $(wc -l < defconfig_output/alioth_defconfig) lines" >> $GITHUB_STEP_SUMMARY

    - name: Send to Telegram
      env:
        TG_TOKEN: ${{ secrets.TG_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        curl -sf -F chat_id="$TG_CHAT_ID" \
          -F document=@defconfig_output/alioth_defconfig \
          -F caption="alioth_defconfig (${{ github.event.inputs.branch }})" \
          "https://api.telegram.org/bot${TG_TOKEN}/sendDocument"

    - name: Upload Defconfig
      uses: actions/upload-artifact@v4
      with:
        name: alioth_defconfig
        path: defconfig_output/alioth_defconfig
        retention-days: 1
