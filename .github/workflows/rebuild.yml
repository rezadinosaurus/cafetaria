name: GCC Generate All Defconfigs

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Kernel repository"
        required: true
        default: "rezadinosaurus/butterflies_xiaomi_sm8250"
      branch:
        description: "Kernel branch"
        required: true
        default: "lineage-latte"

env:
  KBUILD_BUILD_USER: "lloromannic"
  KBUILD_BUILD_HOST: "stargaze"

jobs:
  defconfig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repository }}
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            gcc-arm-linux-gnueabi \
            python3 \
            python-is-python3 \
            git \
            wget \
            curl \
            device-tree-compiler \
            zstd \
            xz-utils \
            zip

      - name: Setup Eva GCC
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/tc/gcc"

          wget -q \
            "https://github.com/mvaisakh/gcc-build/releases/download/01102026/eva-gcc-arm64-01102026.xz" \
            -O "$GITHUB_WORKSPACE/tc/gcc.tar.xz"

          tar -xf "$GITHUB_WORKSPACE/tc/gcc.tar.xz" \
            -C "$GITHUB_WORKSPACE/tc/gcc" \
            --strip-components=1

          echo "$GITHUB_WORKSPACE/tc/gcc/bin" >> "$GITHUB_PATH"

          GCC_PREFIX="$(find "$GITHUB_WORKSPACE/tc/gcc/bin" \
            -maxdepth 1 -type f -name '*-gcc' \
            | head -n1 \
            | sed 's#.*/##; s/gcc$//')"

          if [ -z "$GCC_PREFIX" ]; then
            echo "ERROR: Eva GCC was not found."
            exit 1
          fi

          echo "GCC_PREFIX=$GCC_PREFIX" >> "$GITHUB_ENV"

          echo "Detected GCC:"
          "${GCC_PREFIX}gcc" --version | head -n1

      - name: Generate all defconfigs
        shell: bash
        run: |
          set -e

          chmod +x scripts/update_defconfig

          ./scripts/update_defconfig all

      - name: Verify all generated defconfigs
        shell: bash
        run: |
          set -e

          DEVICES="
          alioth
          apollo
          cas
          cmi
          dagu
          elish
          enuma
          lmi
          munch
          umi
          thyme
          psyche
          "

          for DEVICE in $DEVICES; do
            echo "=========================================="
            echo "Verifying $DEVICE"
            echo "=========================================="

            test -f "arch/arm64/configs/${DEVICE}_defconfig"

            rm -rf "verify-$DEVICE"

            make \
              O="verify-$DEVICE" \
              ARCH=arm64 \
              CROSS_COMPILE="${GCC_PREFIX}" \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              KCFLAGS=-Wno-error \
              "${DEVICE}_defconfig" || \
              make \
                O="verify-$DEVICE" \
                ARCH=arm64 \
                CROSS_COMPILE="${GCC_PREFIX}" \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
                KCFLAGS=-Wno-error \
                "vendor/${DEVICE}_defconfig"

            rm -rf "verify-$DEVICE"
          done

          echo
          echo "All defconfigs verified successfully."

      - name: Show generated defconfig diff
        shell: bash
        run: |
          git diff -- \
            arch/arm64/configs

      - name: Package all generated defconfigs
        shell: bash
        run: |
          set -e

          mkdir -p defconfig-output

          DEVICES="
          alioth
          apollo
          cas
          cmi
          dagu
          elish
          enuma
          lmi
          munch
          umi
          thyme
          psyche
          "

          for DEVICE in $DEVICES; do
            cp \
              "arch/arm64/configs/${DEVICE}_defconfig" \
              "defconfig-output/${DEVICE}_defconfig"
          done

          zip -r defconfigs-all.zip defconfig-output

      - name: Upload all defconfigs
        uses: actions/upload-artifact@v4
        with:
          name: all-generated-defconfigs
          path: |
            defconfigs-all.zip
            defconfig-output/
            arch/arm64/configs/*_defconfig
          retention-days: 7
          
