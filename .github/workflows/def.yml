name: rebuild defconfig

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/butterflies_xiaomi_sm8250' }
      branch: { description: 'Branch', required: true, default: 'lineage-latte' }
      defconfig: { description: 'Defconfig', required: true, default: 'vendor/alioth_defconfig' }

env:
  CHAT_ID: ${{ secrets.CHAT_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  KBUILD_BUILD_USER: "lloromannic"
  KBUILD_BUILD_HOST: "stargaze"

jobs:
  rebuild-defconfig:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.repository }}
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Start Notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ env.CHAT_ID }}" \
        -d text="rebuild defconfig starting sayangg: ${{ github.event.inputs.repository }} [${{ github.event.inputs.branch }}] -> ${{ github.event.inputs.defconfig }}"

    - name: Setup toolchain and generate config
      run: |
        sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc git wget curl

        export TZ="Asia/Jakarta"
        BUILD_TIME=$(date +'%H%M-%d%m%y')
        echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

        mkdir -p tc/gcc
        wget -q "https://github.com/mvaisakh/gcc-build/releases/download/30082026/eva-gcc-arm64-30082026.xz" -O tc/gcc.tar.xz
        tar -xf tc/gcc.tar.xz -C tc/gcc --strip-components=1
        export PATH=$PWD/tc/gcc/bin:$PATH

        GCC_PREFIX=$(find $PWD/tc/gcc/bin -name '*-gcc' | head -n1 | sed 's/.*\///;s/gcc$//')
        echo "Detected GCC prefix: $GCC_PREFIX"

        export ARCH=arm64
        ARGS="O=out ARCH=arm64 CROSS_COMPILE=${GCC_PREFIX} CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"

        make $ARGS ${{ github.event.inputs.defconfig }}

        OUT_NAME="config-$(basename ${{ github.event.inputs.defconfig }})-$BUILD_TIME"
        cp out/.config "$OUT_NAME"
        echo "DEFCONFIG_OUT=$OUT_NAME" >> $GITHUB_ENV

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: config-${{ env.BUILD_TIME }}
        path: ${{ env.DEFCONFIG_OUT }}
        retention-days: 1

    - name: Telegram Notification
      if: always()
      run: |
        [ -f "${{ env.DEFCONFIG_OUT }}" ] && curl -s -F document=@"${{ env.DEFCONFIG_OUT }}" "https://api.telegram.org/
