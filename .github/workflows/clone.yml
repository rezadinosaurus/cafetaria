name: full clone mirror

on:
  workflow_dispatch:
    inputs:
      repository: { description: 'Repo', required: true, default: 'rezadinosaurus/butterflies_xiaomi_sm8250' }
      branch: { description: 'Branch (kosongkan untuk semua branch)', required: false, default: '' }

env:
  CHAT_ID: ${{ secrets.CHAT_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
    - name: Start Notification
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ env.CHAT_ID }}" \
        -d text="Full clone starting: ${{ github.event.inputs.repository }}"

    - name: Full clone
      run: |
        REPO_URL="https://github.com/${{ github.event.inputs.repository }}.git"
        BRANCH="${{ github.event.inputs.branch }}"

        if [ -n "$BRANCH" ]; then
          git clone --branch "$BRANCH" "$REPO_URL" full-repo
        else
          git clone --no-single-branch "$REPO_URL" full-repo
          cd full-repo
          git fetch --all --tags
        fi

    - name: Create bundle
      run: |
        cd full-repo
        git bundle create ../full-repo.bundle --all
        cd ..
        SIZE=$(stat -c%s full-repo.bundle)
        LIMIT=$((1900*1024*1024))
        if [ "$SIZE" -gt "$LIMIT" ]; then
          split -b 1900M full-repo.bundle full-repo.bundle.part-
          rm full-repo.bundle
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: full-repo-bundle
        path: |
          full-repo.bundle
          full-repo.bundle.part-*
        retention-days: 3

    - name: Telegram Notification
      if: always()
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ env.BOT_TOKEN }}/sendMessage" \
        -d chat_id="${{ env.CHAT_ID }}" \
        -d text="Full clone (bundle) done, cek artifact di Actions run ini."
